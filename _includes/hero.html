<header class="hero">
  <div class="hero-text">
    <h1 class="hero-name reveal">
      <span class="hero-name-lead">Karuppuswamy</span>
      <span class="hero-name-main">Kumaresan</span>
    </h1>

    <div class="hero-meta reveal">
      <div class="meta-cell">
        <span class="label">Role</span>
        <div class="meta-value"><strong>Principal Consultant</strong><br>Enterprise Cloud &amp; AI Platforms</div>
      </div>
      <div class="meta-cell">
        <span class="label">Specialisations</span>
        <div class="meta-value">Product Architect · UX Systems Strategist<br>Scalable Infrastructure Advisor</div>
      </div>
      <div class="meta-cell">
        <span class="label">Base</span>
        <div class="meta-value">Chennai, India</div>
      </div>
      <div class="meta-cell">
        <span class="label">Experience</span>
        <div class="meta-value">22+ years designing, scaling &amp; modernising digital systems</div>
      </div>
      <div class="meta-cell meta-cell--wide">
        <span class="label">Contact</span>
        <div class="meta-value">
          <a class="link-underline" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        </div>
      </div>
    </div>
  </div>

  <div class="hero-photo reveal">
    <img src="{{ '/profile.jpg' | relative_url }}" alt="Portrait of Karuppuswamy Kumaresan" width="592" height="760">
  </div>
</header>
